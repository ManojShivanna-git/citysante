name: EAS Build & Submit

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/customer/**'

jobs:
  build:
    name: Build and Submit Customer App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/customer/package-lock.json

      - name: Install dependencies
        working-directory: mobile/customer
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build AAB for Play Store
        working-directory: mobile/customer
        run: eas build --platform android --profile preview --non-interactive

      - name: Submit to Play Store (Closed Testing)
        working-directory: mobile/customer
        run: eas submit --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
