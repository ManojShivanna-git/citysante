name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/isanthe

            echo "📥 Pulling latest code..."
            git pull origin main

            echo "🔧 Building backend..."
            cd backend
            npm ci
            npm run build
            npm prune --omit=dev
            pm2 restart isanthe-api
            cd ..

            echo "🌐 Building customer web..."
            cd web/customer
            npm ci
            npm run build
            cd ../..

            echo "🏪 Building shop-owner web..."
            cd web/shop-owner
            npm ci
            npm run build
            cd ../..

            echo "⚙️ Building admin panel..."
            cd web/admin
            npm ci
            npm run build
            cd ../..

            echo "✅ Deploy complete!"
